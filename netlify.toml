[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # The production build talks to /api. Without this flag the site runs in DEMO mode (localStorage).
  VITE_BACKEND = "api"
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5193
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The NFT function draws PNGs with resvg (WebAssembly, so it works whatever machine builds the deploy)
# and the bundled fonts. Both files are read from disk at run time.
[functions.nft]
  included_files = ["netlify/fonts/**", "node_modules/@resvg/resvg-wasm/index_bg.wasm"]

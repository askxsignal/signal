# /etc/nginx/sites-available/signal  (HTTPS lines are added by certbot)
limit_req_zone $binary_remote_addr zone=sig_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sig_nft:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=sig_auth:10m rate=20r/m;
limit_req_status 429;
proxy_cache_path /var/cache/nginx/signal_nft levels=1:2 keys_zone=sig_nft_cache:20m max_size=2g inactive=7d use_temp_path=off;

upstream signal_app { server 127.0.0.1:8787; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name asksignal.chat www.asksignal.chat;

    if ($host = www.asksignal.chat) { return 301 https://asksignal.chat$request_uri; }

    client_max_body_size 256k;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location /api/nft/ {
        limit_req zone=sig_nft burst=20 nodelay;
        proxy_pass http://signal_app;
    }
    location /api/ {
        limit_req zone=sig_api burst=15 nodelay;
        proxy_pass http://signal_app;
    }
    location /auth/x/ {
        limit_req zone=sig_auth burst=10 nodelay;
        proxy_pass http://signal_app;
    }
    # NFT images and metadata: cached here instead of the Netlify CDN.
    location /nft/ {
        limit_req zone=sig_nft burst=30 nodelay;
        proxy_cache sig_nft_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://signal_app;
    }
    location /assets/ {
        proxy_pass http://signal_app;
        proxy_cache_valid 200 1y;
    }
    location / {
        proxy_pass http://signal_app;
    }
}
